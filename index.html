
<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Little Explorers AI Studio</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #101827;
      color: white;
    }

    .container {
      max-width: 900px;
      margin: auto;
    }

    header {
      text-align: center;
      padding: 25px 10px;
    }

    h1 { color: #65dfcf; }
    header p { color: #c3d0df; }

    .panel {
      background: #1d2a3d;
      border: 1px solid #34465d;
      border-radius: 16px;
      padding: 22px;
      margin-bottom: 18px;
    }

    h2 { color: #ffd166; font-size: 20px; }
    h3 { color: #65dfcf; }

    label {
      display: block;
      margin: 16px 0 8px;
    }

    input, select, textarea {
      width: 100%;
      padding: 13px;
      border-radius: 9px;
      border: 1px solid #53657a;
      background: #101827;
      color: white;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 15px;
      margin-top: 18px;
      border: 0;
      border-radius: 10px;
      background: #65dfcf;
      color: #10202b;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.5;
      cursor: wait;
    }

    #status {
      color: #65dfcf;
      line-height: 1.6;
      white-space: pre-wrap;
    }

    #progressTrack {
      height: 12px;
      background: #101827;
      border-radius: 20px;
      overflow: hidden;
      margin-top: 15px;
    }

    #progressBar {
      height: 100%;
      width: 0%;
      background: #65dfcf;
      transition: width 0.3s;
    }

    .scene {
      border: 1px solid #53657a;
      border-radius: 12px;
      padding: 16px;
      margin-top: 18px;
    }

    .scene img {
      display: block;
      width: 100%;
      max-width: 500px;
      margin: 15px auto;
      border-radius: 12px;
    }

    .scene p {
      line-height: 1.6;
      color: #dce5ef;
    }

    .scene strong { color: #ffd166; }

    footer {
      text-align: center;
      color: #91a0b2;
      padding: 20px;
    }
  </style>
</head>

<body>
  <main class="container">

    <header>
      <h1>Little Explorers AI Studio</h1>
      <p>Puffy ile eğlenceli ve eğitici dünyalar keşfet!</p>
    </header>

    <section class="panel">
      <h2>Yeni video projesi</h2>

      <label>Video konusu</label>
      <input id="topic" placeholder="Örn: Renkleri öğreniyoruz">

      <label>Video dili</label>
      <select id="language">
        <option>Türkçe + English</option>
        <option>Türkçe</option>
        <option>English</option>
      </select>

      <label>Video süresi</label>
      <select id="duration">
        <option value="25">25 saniye</option>
        <option value="30" selected>30 saniye</option>
        <option value="45">45 saniye</option>
        <option value="60">60 saniye</option>
      </select>

      <label>Ek açıklama</label>
      <textarea id="details" rows="3"
        placeholder="Videoda neler olsun?"></textarea>

      <button id="generateButton" onclick="generateFullProject()">
        Tüm projeyi otomatik oluştur
      </button>
    </section>

    <section class="panel">
      <h2>Üretim durumu</h2>
      <p id="status">Henüz üretim başlatılmadı.</p>

      <div id="progressTrack">
        <div id="progressBar"></div>
      </div>
    </section>

    <section class="panel">
      <h2>Video projesi ve sahneler</h2>
      <div id="projectOutput">
        Henüz proje oluşturulmadı.
      </div>
    </section>

    <footer>Little Explorers © 2026</footer>

  </main>

  <script>
    function addText(parent, tag, label, value) {
      const element = document.createElement(tag);
      const strong = document.createElement("strong");

      strong.textContent = label + ": ";
      element.appendChild(strong);
      element.appendChild(
        document.createTextNode(value || "-")
      );

      parent.appendChild(element);
    }

    function showProgress(percent) {
      document.getElementById("progressBar").style.width =
        percent + "%";
    }

    async function generateFullProject() {
      const topic = document.getElementById("topic").value.trim();
      const language = document.getElementById("language").value;
      const duration = Number(document.getElementById("duration").value);
      const details = document.getElementById("details").value.trim();

      const button = document.getElementById("generateButton");
      const status = document.getElementById("status");
      const output = document.getElementById("projectOutput");

      if (!topic) {
        status.textContent = "Lütfen önce video konusunu yaz.";
        return;
      }

      button.disabled = true;
      output.replaceChildren();
      showProgress(0);

      try {
        // AŞAMA 1: Senaryo üretimi
        status.textContent = "1. Aşama: Puffy senaryoyu hazırlıyor...";

        const scriptResponse = await fetch("/api/generate", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            topic,
            language,
            duration,
            details
          })
        });

        const scriptData = await scriptResponse.json();

        if (!scriptResponse.ok || !scriptData.success) {
          throw new Error(
            scriptData.error || "Senaryo oluşturulamadı."
          );
        }

        const project = scriptData.project;

        if (!project || !Array.isArray(project.scenes)) {
          throw new Error("Senaryo sahneleri alınamadı.");
        }

        const title = document.createElement("h3");
        title.textContent =
          project.title_tr + " / " + project.title_en;

        output.appendChild(title);

        const sceneCards = [];

        // Sahne kartlarını önceden oluştur
        project.scenes.forEach((scene) => {
          const card = document.createElement("div");
          card.className = "scene";

          const heading = document.createElement("h3");
          heading.textContent =
            "Sahne " + scene.scene_number +
            " (" + scene.start + "-" + scene.end + " saniye)";

          const imageStatus = document.createElement("p");
          imageStatus.textContent = "Görsel bekleniyor...";

          const image = document.createElement("img");
          image.alt = "Puffy sahne görseli";
          image.style.display = "none";

          card.appendChild(heading);
          card.appendChild(imageStatus);
          card.appendChild(image);

          addText(card, "p", "Hareket", scene.motion);
          addText(card, "p", "Kamera", scene.camera);
          addText(card, "p", "Türkçe seslendirme", scene.voice_tr);
          addText(card, "p", "English narration", scene.voice_en);
          addText(card, "p", "Türkçe ekran yazısı", scene.text_tr);
          addText(card, "p", "English screen text", scene.text_en);
          addText(card, "p", "Ses efekti", scene.sound_effect);

          output.appendChild(card);

          sceneCards.push({
            image,
            imageStatus,
            scene
          });
        });

        // AŞAMA 2: Görselleri sırayla üret
        for (let i = 0; i < sceneCards.length; i++) {
          const item = sceneCards[i];
          const sceneNumber = i + 1;

          status.textContent =
            "2. Aşama: " + sceneNumber +
            "/" + sceneCards.length +
            " sahnenin görseli oluşturuluyor...";

          item.imageStatus.textContent =
            "Görsel oluşturuluyor...";

          const imageResponse = await fetch("/api/generate-image", {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              prompt: item.scene.image_prompt
            })
          });

          const imageData = await imageResponse.json();

          if (
            !imageResponse.ok ||
            !imageData.success ||
            !imageData.image
          ) {
            throw new Error(
              "Sahne " + sceneNumber + ": " +
              (imageData.error || "Görsel üretilemedi.")
            );
          }

          item.image.src = imageData.image;
          item.image.style.display = "block";
          item.imageStatus.textContent =
            "Görsel başarıyla oluşturuldu.";

          showProgress(
            Math.round(((i + 1) / sceneCards.length) * 100)
          );
        }

        // AŞAMA 3: Proje bilgileri
        const description = document.createElement("div");
        description.className = "scene";

        addText(
          description,
          "p",
          "Türkçe YouTube açıklaması",
          project.description_tr
        );

        addText(
          description,
          "p",
          "English YouTube description",
          project.description_en
        );

        addText(
          description,
          "p",
          "Etiketler",
          Array.isArray(project.tags)
            ? project.tags.join(" ")
            : project.tags
        );

        output.appendChild(description);

        status.textContent =
          "Tamamlandı! " + sceneCards.length +
          " sahnenin görselleri üretildi. Projeni kontrol edebilirsin.";

        showProgress(100);

      } catch (error) {
        status.textContent =
          "Üretim durdu: " + error.message +
          "\nTamamlanan sahneler ekranda korunmuştur.";
      } finally {
        button.disabled = false;
      }
    }
  </script>

</body>
</html>
